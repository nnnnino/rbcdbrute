[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rbcdbrute"
version = "1.1.0"
description = "Parallel local-admin discovery on an RBCD-controlled host via S4U2Self + S4U2Proxy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "impacket>=0.11",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/nnnnino/rbcdbrute"

[project.scripts]
rbcdbrute = "rbcdbrute:main"

[tool.setuptools]
py-modules = ["rbcdbrute"]
